[package]
name = "physics"
version = "0.1.0"
edition = "2021"
description = "Field Station 04 — verlet cloth + SAT rigid bodies, compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/timetodoit/Experiments"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
